<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HBD love</title>	    

<link type="text/css" rel="stylesheet" href="file/default.css">

<script src="file/jquery.min.js"></script>
<script src="file/jscex.min.js"></script>
<script src="file/jscex-parser.js"></script>
<script src="file/jscex-jit.js"></script>
<script src="file/jscex-builderbase.min.js"></script>
<script src="file/jscex-async.min.js"></script>
<script src="file/jscex-async-powerpack.min.js"></script>
<script src="file/function.js"></script>
<script src="file/love.js"></script>

<script>
function playAudio() {
    document.getElementById("myAudio").play();
}
</script>

<style>

/* ===== 3 IMAGE BACKGROUND ===== */
.image-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;

    background: black;
    z-index: -1;
}

.side-img {
    height: 80%;
    width: 140%;
    object-fit: cover;
}

/* ===== MOBILE RESPONSIVE (ONLY ADDITION) ===== */
@media screen and (max-width: 768px) {

    .image-container {
        flex-direction: row;
        gap: 5px;
    }

    .side-img {
        width: 33%;
        height: 100%;
        object-fit: cover;
    }

    #wrap {
        width: 100%;
        padding: 10px;
    }

    #text {
        font-size: 14px;
        text-align: center;
    }

    #code {
        font-size: 14px;
        line-height: 1.6;
    }

    #clock-box {
        font-size: 14px;
        text-align: center;
    }

    canvas {
        width: 100% !important;
        height: auto !important;
    }
}

</style>

</head>

<body>

<!-- 🔥 3 Images -->
<div class="image-container">
    <img src="photo3.jpeg" class="side-img">
    <img src="Black.png" class="side-img">
    <img src="photo1.png" class="side-img">
</div>

<div id="main">
    <div id="error">
        <a href="#">Chrome</a> (<a href="#">Firefox</a>)
    </div>

    <audio autoplay id="myAudio">
        <source src="aud.mp3" type="audio/mp3" />
    </audio>

    <div id="wrap">
        <div id="text">
            <div id="code">
                <span class="say">Hiee riya 💞</span><br>
                <span class="say">Happy Birthday to you🎈</span><br>
                <span class="say">May God bless you 🍀</span><br>
                <span class="say">And give u many happiness 💕</span><br>
                <span class="say">Having you in my life is the best thing ❤️</span><br>
                <span class="say">Hope u have a great day ❤️😘</span><br>
                <span class="say">I love You my gurl ❤️😘</span><br>
            </div>
        </div>

        <div id="clock-box">
            <span id="clock">185 days 0 hours 0 minutes 0 seconds</span> 
        </div>

        <canvas id="canvas" width="1100" height="680"></canvas>
    </div>
</div>

<script>
(function() {
    var canvas = $('#canvas');
    
    if (!canvas[0].getContext) {
        $("#error").show();
        return false;
    }

    var width = canvas.width();
    var height = canvas.height();        
    canvas.attr("width", width);
    canvas.attr("height", height);

    var opts = {
        seed: {
            x: width / 2 - 20,
            color: "rgb(190, 26, 37)",
            scale: 2
        },
        branch: [[535,680,570,250,500,200,30,100,[
            [540,500,455,417,340,400,13,100,[
                [450,435,434,430,394,395,2,40]
            ]],
            [550,445,600,356,680,345,12,100,[
                [578,400,648,409,661,426,3,80]
            ]]
        ]]],
        bloom: { num: 700, width: 1080, height: 650 },
        footer: { width: 1200, height: 5, speed: 10 }
    }

    var tree = new Tree(canvas[0], width, height, opts);
    var seed = tree.seed;
    var foot = tree.footer;
    var hold = 1;

    canvas.click(function(e) {
        playAudio();
        var offset = canvas.offset();
        var x = e.pageX - offset.left;
        var y = e.pageY - offset.top;
        if (seed.hover(x, y)) {
            hold = 0;
            canvas.unbind("click");
        }
    });

    var seedAnimate = eval(Jscex.compile("async", function () {
        seed.draw();
        while (hold) $await(Jscex.Async.sleep(10));
    }));

    var growAnimate = eval(Jscex.compile("async", function () {
        do {
            tree.grow();
            $await(Jscex.Async.sleep(10));
        } while (tree.canGrow());
    }));

    var flowAnimate = eval(Jscex.compile("async", function () {
        do {
            tree.flower(2);
            $await(Jscex.Async.sleep(10));
        } while (tree.canFlower());
    }));

    var runAsync = eval(Jscex.compile("async", function () {
        $await(seedAnimate());
        $await(growAnimate());
        $await(flowAnimate());
        $("#code").show().typewriter();
    }));

    runAsync().start();
})();
</script>

</body>
</html>
